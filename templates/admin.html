<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Administrador</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; padding: 30px; display: flex; justify-content: center; }
        
        .container { width: 100%; max-width: 800px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #30363d; padding-bottom: 15px; }
        .header h1 { font-size: 20px; color: #f0f6fc; }
        
        .btn-voltar { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 8px 12px; border-radius: 4px; text-decoration: none; font-size: 13px; }
        .btn-voltar:hover { background: #30363d; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #30363d; padding: 12px; text-align: left; font-size: 14px; }
        th { background: #0d1117; color: #8b949e; }

        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-liberado { background: rgba(46, 160, 67, 0.2); color: #3fb950; border: 1px solid #2ea043; }
        .badge-pendente { background: rgba(212, 167, 44, 0.2); color: #d29922; border: 1px solid #d29922; }

        .btn-action { padding: 6px 12px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; font-size: 12px; }
        .btn-liberar { background: #238636; color: white; }
        .btn-bloquear { background: #da3633; color: white; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1> Painel de Gestão de Usuários</h1>
            <a href="/" class="btn-voltar"> Voltar à Agenda</a>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Usuário</th>
                    <th>Perfil</th>
                    <th>Status de Acesso</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody>
                {% for nome, user in usuarios.items() %}
                <tr>
                    <td><strong>{{ nome }}</strong></td>
                    <td>{{ user.role.upper() }}</td>
                    <td>
                        {% if user.ativo %}
                            <span class="badge badge-liberado">Liberado</span>
                        {% else %}
                            <span class="badge badge-pendente">Aguardando Liberação</span>
                        {% endif %}
                    </td>
                    <td>
                        {% if nome != 'admin' %}
                            <button class="btn-action {% if user.ativo %}btn-bloquear{% else %}btn-liberar{% endif %}" 
                                    onclick="alternarAcesso('{{ nome }}')">
                                {% if user.ativo %}Bloquear Acesso{% else %}Liberar Acesso{% endif %}
                            </button>
                        {% else %}
                            <span style="color: #8b949e; font-size: 12px;">N/A</span>
                        {% endif %}
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <script>
        async function alternarAcesso(usuario) {
            const res = await fetch('/admin/toggle-status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario })
            });

            if (res.ok) {
                location.reload();
            } else {
                alert('Erro ao alterar o status do usuário.');
            }
        }
    </script>
</body>
</html>
